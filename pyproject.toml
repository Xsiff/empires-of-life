[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "empires-of-life"
version = "0.1.0"
description = "Minimlaistic empire simulator trained with RL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "sts2-cli contributors" }]
dependencies = [
  "torch>=2.3",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pytest",
  "ruff",
  "ty",
  "torch"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
  "slow: long-running integration coverage",
]
